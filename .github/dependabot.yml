# Weekly update proposals for every dependency source. Each arrives as a pull request, so the CI drills
# run against it before anything merges.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend/requirements
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /agents
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /frontend V2
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
