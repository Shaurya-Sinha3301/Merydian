# Every pull request and every push to main: the checks that prove the backend's guarantees, against a
# real Postgres and Redis, plus both images and the web app. A change that breaks any of them cannot merge
# (make this workflow a required check in the branch protection rules).
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SQLALCHEMY_DATABASE_URI: postgresql://ci:ci-only-password@localhost:5432/ci
  REDIS_URL: redis://localhost:6379/0
  SECRET_KEY: ci-only-secret-key-0123456789abcdef
  APP_MODE: showcase
  PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements/*.txt
            agents/requirements_agents.txt
      - name: Install
        run: pip install -r requirements/worker.txt -r ../agents/requirements_agents.txt pip-audit
      - name: Compile every module
        run: python -m compileall -q app scripts migrations ../agents ../ml_or
      - name: Known vulnerabilities in pinned dependencies
        # One reviewed exception. CVE-2026-114605 is in dnspython's DNS wire-format parser
        # (dns.name.from_wire_parser). dnspython is here only because email-validator requires it; the app never
        # makes DNS lookups (no deliverability checks), so it never parses a DNS message. The fix (2.9.0) is
        # not on PyPI yet; remove this ignore when Dependabot brings it in.
        run: pip-audit -r requirements/api.txt -r requirements/worker.txt --ignore-vuln CVE-2026-114605
      - name: Migrations (one head, fresh build, undo and redo, adoption, refusal)
        run: python scripts/deploy/check_migrations.py
      - name: Database-level drills
        run: |
          for check in hardening_check stateless_check fencing_check scheduler_check; do
            db="ci_${check}"
            PGPASSWORD=ci-only-password psql -h localhost -U ci -d ci -c "CREATE DATABASE ${db}"
            SQLALCHEMY_DATABASE_URI="postgresql://ci:ci-only-password@localhost:5432/${db}" python scripts/db_bootstrap.py
            SQLALCHEMY_DATABASE_URI="postgresql://ci:ci-only-password@localhost:5432/${db}" python scripts/deploy/${check}.py
          done
      - name: Redis split (two instances started with their real settings)
        run: |
          docker run -d --name q -p 6391:6379 redis:7-alpine redis-server --maxmemory 64mb --maxmemory-policy noeviction --appendonly yes
          docker run -d --name e -p 6392:6379 redis:7-alpine redis-server --maxmemory 4mb --maxmemory-policy allkeys-lru --save "" --appendonly no
          PGPASSWORD=ci-only-password psql -h localhost -U ci -d ci -c "CREATE DATABASE ci_redis"
          export SQLALCHEMY_DATABASE_URI=postgresql://ci:ci-only-password@localhost:5432/ci_redis
          python scripts/db_bootstrap.py
          REDIS_QUEUE_URL=redis://localhost:6391/0 REDIS_EPHEMERAL_URL=redis://localhost:6392/0 python scripts/deploy/redis_split_check.py
      - name: API and worker drills (real processes)
        run: |
          python scripts/deploy/stack.py scripts/deploy/idempotency_check.py
          python scripts/deploy/stack.py --env APP_MODE=production --env DEMO_ENABLED=true --env DEV_OUTBOX=true --env TRUSTED_PROXY_HOPS=1 scripts/deploy/limits_check.py
          python scripts/deploy/stack.py --worker --env WEBHOOK_ALLOW_PRIVATE=true scripts/deploy/outbox_check.py
          python scripts/deploy/stack.py --worker scripts/deploy/nonblocking_check.py
          python scripts/deploy/stack.py --worker scripts/deploy/observability_check.py
      - name: Resilience drills (database restart, an API copy dying, webhook guard, sign out everywhere)
        run: |
          docker run -d --name drill-pg -e POSTGRES_USER=drill -e POSTGRES_PASSWORD=drill-local-only -e POSTGRES_DB=drill -p 5433:5432 postgres:15-alpine
          until docker exec drill-pg pg_isready -q; do sleep 1; done
          STACK_DB_CONTAINER=drill-pg python scripts/deploy/stack.py --apis 2 --port 8041 --worker --scheduler \
            --env JOB_LEASE_SECONDS=20 --env JOB_HEARTBEAT_SECONDS=5 --env SCHEDULER_SWEEP_SECONDS=10 \
            --env SCHEDULER_LOST_AFTER_SECONDS=10 --env SCHEDULER_TICK_SECONDS=3 \
            --db-server postgresql://drill:drill-local-only@localhost:5433/drill scripts/deploy/resilience_check.py

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build --target api -t merydian-api:ci .
      - name: Build the worker image
        run: docker build --target worker -t merydian-worker:ci .
      - name: The API image cannot run a solve
        run: |
          docker run --rm --entrypoint python merydian-api:ci -c \
            "import importlib.util as u, sys; found=[m for m in ('ortools','groq','agents') if u.find_spec(m)]; print(found); sys.exit(1 if found else 0)"
      - name: Smoke test of the image the way Render runs it
        run: |
          docker network create ci
          docker run -d --name pg --network ci -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci-only-password -e POSTGRES_DB=ci postgres:15-alpine
          docker run -d --name rd --network ci redis:7-alpine redis-server --maxmemory-policy noeviction
          until docker exec pg pg_isready -q; do sleep 1; done
          docker run -d --name app --network ci -p 8010:8000 \
            -e SQLALCHEMY_DATABASE_URI=postgresql://ci:ci-only-password@pg:5432/ci -e REDIS_URL=redis://rd:6379/0 \
            -e SECRET_KEY=ci-only-secret-key-0123456789abcdef -e APP_MODE=showcase -e SEED_ON_START=true \
            -e AGENT_SIGNUP_CODE=ci-code -e GROQ_API_KEY=ci-placeholder-not-a-real-key -e CELERY_CONCURRENCY=1 \
            -e BACKEND_CORS_ORIGINS='["https://example.vercel.app"]' merydian-worker:ci all
          for i in $(seq 1 90); do curl -fs localhost:8010/health/ready && break; sleep 2; done
          pip install requests
          python backend/scripts/deploy/smoke_test.py http://127.0.0.1:8010 ci-code

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend V2
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend V2/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: npx tsc -p tsconfig.json --noEmit
      - name: Build
        run: pnpm run build
