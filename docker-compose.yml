version: '3.9'

# ─── Shared environment — all credentials loaded from .env ───────────────
x-backend-env:
  &backend-env
  # ── Database
  SQLALCHEMY_DATABASE_URI: "${SQLALCHEMY_DATABASE_URI}"

  # ── Security ────────────────────────────────────────────────────────────────
  SECRET_KEY: "${SECRET_KEY}"
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"

  # ── CORS ────────────────────────────────────────────────────────────────────
  BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://localhost:8000","http://localhost:5173","http://127.0.0.1:5173","http://localhost:8443","http://127.0.0.1:8443"]'

  # ── AI Agents ───────────────────────────────────────────────────────────────
  GROQ_API_KEY: "${GROQ_API_KEY}"
  GEMINI_API_KEY: "${GEMINI_API_KEY}"
  GROQ_MODEL: "openai/gpt-oss-20b"

  # ── TBO Hotel API ──────────────────────────────────────────────────
  TBO_API_URL: "${TBO_API_URL}"
  TBO_USERNAME: "${TBO_USERNAME}"
  TBO_PASSWORD: "${TBO_PASSWORD}"

  # ── TBO Air API ────────────────────────────────────────
  TBO_AIR_AUTHENTICATE_URL: "${TBO_AIR_AUTHENTICATE_URL}"
  TBO_AIR_SERVICE_URL: "${TBO_AIR_SERVICE_URL}"
  TBO_AIR_USERNAME: "${TBO_AIR_USERNAME}"
  TBO_AIR_PASSWORD: "${TBO_AIR_PASSWORD}"

  # ── Redis / Celery ───────────────────────────────────────────────────────────
  # Two Redis roles (backend/app/core/redis.py): the queue never evicts, the ephemeral one may
  REDIS_URL: "redis://redis:6379/0"
  REDIS_QUEUE_URL: "redis://redis:6379/0"
  REDIS_EPHEMERAL_URL: "redis://redis-ephemeral:6379/0"

  # ── ML Optimizer paths (inside container) ───────────────────────────────────
  ML_OPTIMIZER_BASE_DATA: "/app/ml_or/data"
  TRIP_SESSION_STORAGE: "/app/backend/trip_sessions"
  OPTIMIZER_OUTPUT_DIR: "/app/backend/optimizer_outputs"

  # ── Logging & performance ────────────────────────────────────────────────────
  LOG_LEVEL: "info"
  APP_MODE: "showcase"
  UVICORN_WORKERS: "2"
  CELERY_CONCURRENCY: "4"

# ─── Shared volume mounts ─────────────────────────────────────────────────────
x-backend-volumes: &backend-volumes
  - ./backend:/app/backend
  - ./agents:/app/agents
  - ./ml_or:/app/ml_or
  - trip_sessions:/app/backend/trip_sessions
  - optimizer_outputs:/app/backend/optimizer_outputs

# ─── Shared build config ──────────────────────────────────────────────────────
x-backend-build: &backend-build
  context: .
  dockerfile: Dockerfile

services:

  # ── 1. Redis (broker + result backend + cache) ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: meiliai_redis
    restart: unless-stopped
    # The queue role: broker, locks, security counters, heartbeats. Never evicts (a full instance refuses
    # writes loudly instead of dropping queued work); append-only file synced once a second.
    command: >
      redis-server --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes --appendfsync everysec --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  # The ephemeral role: read cache, low-value rate limits, live-notification pub/sub. No persistence, and it
  # evicts the least recently used keys when full, which only costs speed.
  redis-ephemeral:
    image: redis:7-alpine
    container_name: meiliai_redis_ephemeral
    restart: unless-stopped
    command: >
      redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save "" --appendonly no --loglevel warning
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── 1.5 Postgres Database ───────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: meiliai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "meiliai"
      POSTGRES_PASSWORD: "meiliai_secret"
      POSTGRES_DB: "meiliai"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meiliai -d meiliai"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ── 2. DB Migration (runs Alembic, then exits) ──────────────────────────────
  migrate:
    build: *backend-build
    container_name: meiliai_migrate
    command: [ "migrate" ]
    environment: *backend-env
    volumes: *backend-volumes
    restart: "no"

  # ── 3. FastAPI Application ──────────────────────────────────────────────────
  api:
    build: *backend-build
    container_name: meiliai_api
    restart: unless-stopped
    command: [ "api" ]
    environment: *backend-env
    volumes: *backend-volumes
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── 4. Celery Worker (booking jobs + agent tasks + events) ──────────────────
  celery_worker:
    build: *backend-build
    container_name: meiliai_celery_worker
    restart: unless-stopped
    command: [ "worker" ]
    environment: *backend-env
    volumes: *backend-volumes
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '2'
          memory: 1G

  # ── 5. Celery Beat (periodic scheduler) ────────────────────────────────────
  celery_beat:
    build: *backend-build
    container_name: meiliai_celery_beat
    restart: unless-stopped
    command: [ "beat" ]
    environment: *backend-env
    volumes: *backend-volumes
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ── 6. Flower (Celery monitoring UI — admin/admin) ──────────────────────────
  flower:
    build: *backend-build
    container_name: meiliai_flower
    restart: unless-stopped
    command: [ "flower" ]
    environment:
      <<: *backend-env
      FLOWER_USER: "admin"
      FLOWER_PASSWORD: "admin"
    volumes: *backend-volumes
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  trip_sessions:
    driver: local
  optimizer_outputs:
    driver: local

networks:
  default:
    name: meiliai_network
    driver: bridge
